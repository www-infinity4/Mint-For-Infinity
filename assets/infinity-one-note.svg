<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" role="img" aria-labelledby="title desc">
  <title id="title">One Infinity Capital Note</title>
  <desc id="desc">Ornate green engraved banknote without a portrait, featuring an IC monogram and reserved areas for a commit serial and holder signature.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0d9"/>
      <stop offset="0.48" stop-color="#dfe8d2"/>
      <stop offset="1" stop-color="#c8d7bd"/>
    </linearGradient>
    <radialGradient id="seal" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#f7f3d8"/>
      <stop offset="0.62" stop-color="#bdd0b2"/>
      <stop offset="1" stop-color="#557660"/>
    </radialGradient>
    <pattern id="micro" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(17)">
      <path d="M0 11 Q5 2 11 11 T22 11" fill="none" stroke="#43664e" stroke-width="0.7" opacity="0.42"/>
      <path d="M0 16 Q5 7 11 16 T22 16" fill="none" stroke="#77937d" stroke-width="0.55" opacity="0.38"/>
    </pattern>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#244e35" stroke-width="0.28" opacity="0.3"/>
    </pattern>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency="0.75" numOctaves="2" seed="17" type="fractalNoise" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <path id="topArc" d="M368 189 A210 118 0 0 1 782 189"/>
    <path id="bottomArc" d="M378 330 A205 105 0 0 0 772 330"/>
  </defs>

  <rect x="3" y="3" width="1144" height="494" rx="22" fill="url(#paper)" stroke="#173e2a" stroke-width="6" filter="url(#paperNoise)"/>
  <rect x="18" y="18" width="1114" height="464" rx="16" fill="url(#micro)" stroke="#315e43" stroke-width="2.5"/>
  <rect x="31" y="31" width="1088" height="438" rx="12" fill="none" stroke="#173e2a" stroke-width="1.5"/>
  <rect x="42" y="42" width="1066" height="416" rx="9" fill="#e7ecd9" fill-opacity="0.72" stroke="#66836c" stroke-width="1"/>

  <g fill="none" stroke="#315f43" opacity="0.8">
    <path d="M52 86 C112 34 181 42 227 87 S349 137 412 82 S541 35 575 85 S713 141 780 80 S923 36 1098 91" stroke-width="2"/>
    <path d="M52 414 C112 466 181 458 227 413 S349 363 412 418 S541 465 575 415 S713 359 780 420 S923 464 1098 409" stroke-width="2"/>
    <path d="M62 111 C143 58 226 67 286 116 S416 157 479 105"/>
    <path d="M1088 111 C1007 58 924 67 864 116 S734 157 671 105"/>
    <path d="M62 389 C143 442 226 433 286 384 S416 343 479 395"/>
    <path d="M1088 389 C1007 442 924 433 864 384 S734 343 671 395"/>
  </g>

  <g fill="#234b34" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="575" y="78" font-size="28" font-weight="700" letter-spacing="7">BANK OF THE NWO RESERVE</text>
    <text x="575" y="108" font-size="14" letter-spacing="5">INFINITY CAPITAL NOTES</text>
  </g>

  <g transform="translate(575 258)">
    <ellipse rx="191" ry="151" fill="url(#fine)" stroke="#315f43" stroke-width="2"/>
    <ellipse rx="176" ry="137" fill="none" stroke="#79937c" stroke-width="4"/>
    <ellipse rx="150" ry="118" fill="url(#seal)" stroke="#173e2a" stroke-width="4"/>
    <ellipse rx="132" ry="101" fill="none" stroke="#6d8971" stroke-width="2" stroke-dasharray="3 5"/>
    <g fill="none" stroke="#375f45" opacity="0.72">
      <ellipse rx="116" ry="88" transform="rotate(0)"/>
      <ellipse rx="116" ry="88" transform="rotate(22.5)"/>
      <ellipse rx="116" ry="88" transform="rotate(45)"/>
      <ellipse rx="116" ry="88" transform="rotate(67.5)"/>
      <ellipse rx="116" ry="88" transform="rotate(90)"/>
      <ellipse rx="116" ry="88" transform="rotate(112.5)"/>
      <ellipse rx="116" ry="88" transform="rotate(135)"/>
      <ellipse rx="116" ry="88" transform="rotate(157.5)"/>
    </g>
    <circle r="72" fill="#e9ead3" stroke="#173e2a" stroke-width="4"/>
    <circle r="62" fill="none" stroke="#789079" stroke-width="2"/>
    <text y="20" fill="#173e2a" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-8" text-anchor="middle">IC</text>
    <text y="49" fill="#315f43" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="3" text-anchor="middle">INFINITY CAPITAL</text>
  </g>

  <g fill="#173e2a" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="112" y="171" font-size="112">1</text>
    <text x="1038" y="171" font-size="112">1</text>
    <text x="112" y="411" font-size="112">1</text>
    <text x="1038" y="411" font-size="112">1</text>
  </g>

  <g fill="#315f43" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text font-size="11" letter-spacing="3"><textPath href="#topArc" startOffset="50%">EVERY NOTE IS UNIQUE</textPath></text>
    <text font-size="10" letter-spacing="2.5"><textPath href="#bottomArc" startOffset="50%">COMMIT • SIGNATURE • LIVING TOKEN</textPath></text>
    <text x="575" y="443" font-size="30" font-weight="700" letter-spacing="8">ONE INFINITY</text>
  </g>

  <g fill="#315f43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">
    <text x="92" y="334">COMMIT SERIAL</text>
    <text x="867" y="334">HOLDER SIGNATURE</text>
  </g>
  <line x1="88" y1="350" x2="305" y2="350" stroke="#315f43" stroke-width="1"/>
  <line x1="845" y1="350" x2="1062" y2="350" stroke="#315f43" stroke-width="1"/>
</svg>
