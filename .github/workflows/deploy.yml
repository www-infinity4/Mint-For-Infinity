name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp moderation.js dist/moderation.js
          cp creation-toolkit.js dist/creation-toolkit.js
          cp royalty-ledger.html dist/royalty-ledger.html
          cp royalty-ledger.js dist/royalty-ledger.js
          cp royalty-ledger-page.js dist/royalty-ledger-page.js
          cp royalty-policy.json dist/royalty-policy.json
          cp .nojekyll dist/.nojekyll
          cp -R assets dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
